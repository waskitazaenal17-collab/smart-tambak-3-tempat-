<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Fish Pond Dashboard PRO</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* === STYLE DASAR === */
    * { box-sizing: border-box; }
    body {
      font-family: "Poppins", sans-serif;
      background: #f4f7fa;
      margin: 0;
      color: #333;
    }
    header {
      background: linear-gradient(135deg, #0077b6, #00b4d8);
      color: white;
      text-align: center;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    header h1 { margin: 0; font-size: 1.8em; }
    header p { margin: 5px 0 0; font-weight: 300; }

    main {
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    /* === KARTU STATUS === */
    .status-section {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }
    .card {
      background: white;
      width: 170px;
      margin: 10px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      padding: 15px;
      text-align: center;
      transition: transform 0.3s;
    }
    .card:hover { transform: scale(1.05); }
    .card h2 { color: #0077b6; font-size: 1em; margin: 5px 0; }
    .card p { font-size: 1.6em; margin: 5px 0; font-weight: bold; }

    /* === GRAFIK === */
    .chart-container {
      background: white;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }

    /* === KONTROL PERANGKAT === */
    .control-section {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }
    .control-section h3 {
      color: #0077b6;
      margin-bottom: 15px;
      text-align: center;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
    }
    .control-btn {
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 1em;
      color: white;
      background: #00b4d8;
      margin: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    .control-btn.off { background: #ef233c; }
    .control-btn:hover { opacity: 0.8; }

    /* === STATUS ALERT === */
    .alert {
      text-align: center;
      font-weight: bold;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
    }
    .alert.safe { background: #c8e6c9; color: #2e7d32; }
    .alert.warning { background: #fff3cd; color: #856404; }
    .alert.danger { background: #f8d7da; color: #721c24; }

    /* === FOOTER === */
    footer {
      background: #0077b6;
      color: white;
      text-align: center;
      padding: 10px;
      font-size: 0.9em;
    }

    @media(max-width:600px){
      .card { width: 45%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🐟 Smart Fish Pond Dashboard PRO</h1>
    <p>Real-Time Monitoring & Control System</p>
  </header>

  <main>
    <!-- ALERT STATUS -->
    <div id="statusAlert" class="alert safe">Kondisi Tambak: Normal</div>

    <!-- DATA SENSOR -->
    <section class="status-section">
      <div class="card"><h2>Suhu</h2><p id="temp">-- °C</p></div>
      <div class="card"><h2>pH Air</h2><p id="ph">--</p></div>
      <div class="card"><h2>Oksigen (DO)</h2><p id="do">-- mg/L</p></div>
      <div class="card"><h2>Kekeruhan</h2><p id="turbidity">-- NTU</p></div>
      <div class="card"><h2>Level Air</h2><p id="level">-- cm</p></div>
    </section>

    <!-- GRAFIK -->
    <section class="chart-container">
      <canvas id="chartSensor"></canvas>
    </section>

    <!-- KONTROL OTOMATIS -->
    <section class="control-section">
      <h3>Kontrol Perangkat</h3>
      <div class="controls">
        <button class="control-btn" id="pump">Pompa Air</button>
        <button class="control-btn" id="aerator">Aerator</button>
        <button class="control-btn" id="valve">Katup Air</button>
      </div>
    </section>
  </main>

  <footer>© 2025 Smart IoT System | Developed by Waskita</footer>

  <script>
    // ======= SIMULASI DATA SENSOR =======
    const dataSensor = { temp: 0, ph: 0, do: 0, turbidity: 0, level: 0 };
    const chartCtx = document.getElementById('chartSensor').getContext('2d');
    const chart = new Chart(chartCtx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'Suhu (°C)', borderColor: '#0077b6', data: [], fill: false },
          { label: 'pH', borderColor: '#ff6b6b', data: [], fill: false },
          { label: 'DO (mg/L)', borderColor: '#00b894', data: [], fill: false }
        ]
      },
      options: {
        responsive: true,
        scales: {
          x: { title: { display: true, text: 'Waktu' } },
          y: { title: { display: true, text: 'Nilai' } }
        },
        plugins: { legend: { position: 'bottom' } }
      }
    });

    function generateData() {
      dataSensor.temp = (25 + Math.random() * 5).toFixed(2);
      dataSensor.ph = (6 + Math.random() * 2).toFixed(2);
      dataSensor.do = (5 + Math.random() * 2).toFixed(2);
      dataSensor.turbidity = (10 + Math.random() * 20).toFixed(1);
      dataSensor.level = (80 + Math.random() * 10).toFixed(1);

      document.getElementById('temp').textContent = dataSensor.temp + " °C";
      document.getElementById('ph').textContent = dataSensor.ph;
      document.getElementById('do').textContent = dataSensor.do + " mg/L";
      document.getElementById('turbidity').textContent = dataSensor.turbidity + " NTU";
      document.getElementById('level').textContent = dataSensor.level + " cm";

      updateChart();
      checkAlert();
    }

    function updateChart() {
      const now = new Date().toLocaleTimeString();
      chart.data.labels.push(now);
      chart.data.datasets[0].data.push(dataSensor.temp);
      chart.data.datasets[1].data.push(dataSensor.ph);
      chart.data.datasets[2].data.push(dataSensor.do);

      if(chart.data.labels.length > 10){
        chart.data.labels.shift();
        chart.data.datasets.forEach(d => d.data.shift());
      }
      chart.update();
    }

    function checkAlert() {
      const alertBox = document.getElementById('statusAlert');
      const t = parseFloat(dataSensor.temp);
      const p = parseFloat(dataSensor.ph);
      const d = parseFloat(dataSensor.do);

      if (t < 25 || p < 6.5 || p > 8.0 || d < 5) {
        alertBox.className = 'alert danger';
        alertBox.textContent = "⚠️ Kondisi Bahaya! Periksa Kualitas Air!";
      } else if (t > 28 || p > 7.8) {
        alertBox.className = 'alert warning';
        alertBox.textContent = "⚠️ Perlu Perhatian: Kualitas Air Tidak Stabil";
      } else {
        alertBox.className = 'alert safe';
        alertBox.textContent = "✅ Kondisi Tambak: Normal";
      }
    }

    setInterval(generateData, 2000);

    // ======= KONTROL PERANGKAT =======
    const buttons = document.querySelectorAll('.control-btn');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        btn.classList.toggle('off');
        btn.textContent = btn.classList.contains('off')
          ? btn.textContent + " OFF"
          : btn.textContent.replace(" OFF", "");
      });
    });
  </script>
</body>
</html>
